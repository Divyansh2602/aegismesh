[project]
name = "aegismesh"
version = "0.1.0"
description = "Provenance-bound action control for AI agents"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=43",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aegis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]

[tool.ruff.lint.isort]
# Test modules import shared scenario helpers from tests/conftest.py, which pytest puts on
# sys.path. Naming it here keeps those imports in their own block instead of being sorted
# in among the aegis packages.
known-local-folder = ["conftest"]
