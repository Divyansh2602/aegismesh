[project]
name = "aegismesh"
version = "0.1.0"
description = "Provenance-bound action control for AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Divyansh Gupta" }]
keywords = [
    "ai-agents", "prompt-injection", "provenance", "verifiable-credentials",
    "transparency-log", "causal-attribution", "eu-ai-act",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "cryptography>=43",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]
# Phase 4's evaluation set. Kept out of `dev` on purpose: it pulls in about thirty
# packages including several provider SDKs, and the whole point of this project running
# offline for free is lost if installing it becomes mandatory. Everything in `aegis`
# except `aegis.evaluation.agentdojo` works without it, the tests that need it skip, and
# `results/phase4_agentdojo.json` is committed so the numbers are readable regardless.
agentdojo = [
    "agentdojo>=0.1.35",
    "pyyaml>=6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aegis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]

[tool.ruff.lint.isort]
# Test modules import shared scenario helpers from tests/conftest.py, which pytest puts on
# sys.path. Naming it here keeps those imports in their own block instead of being sorted
# in among the aegis packages.
known-local-folder = ["conftest"]
